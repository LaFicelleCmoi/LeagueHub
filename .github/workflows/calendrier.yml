# Relève chaque nuit le calendrier des championnats et des coupes nationales chez ESPN
# (horaires fixés tardivement, matchs reportés, tours tirés au sort) et publie les changements :
# un commit par fichier modifié, puis Vercel redéploie le site.
name: Calendrier

on:
  schedule:
    # 3 h 17 UTC (5 h 17 à Paris l'été) : après les derniers matchs de la soirée.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # Ouvrir une issue quand une compétition apparaît chez ESPN (voir plus bas).
  issues: write

concurrency:
  group: calendrier
  cancel-in-progress: false

jobs:
  calendrier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Relevé du calendrier
        run: npm run calendrier

      # Une coupe n'est publiée chez ESPN qu'une fois ses tours tirés (Coupe de France : à partir des
      # 32es de finale, en décembre). Quand un calendrier vide reçoit ses premiers matchs, une issue
      # prévient le propriétaire du dépôt.
      - name: Signale les calendriers qui reçoivent leurs premiers matchs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count='let s="";process.stdin.on("data",(d)=>(s+=d)).on("end",()=>{try{console.log(JSON.parse(s).matches.length)}catch{console.log(0)}})'
          for file in $(git status --porcelain -- src/data/calendrier | awk '{ print $2 }'); do
            before=$(git show "HEAD:$file" 2>/dev/null | node -e "$count")
            after=$(node -e "$count" < "$file")
            if [ "$before" = "0" ] && [ "$after" != "0" ]; then
              slug=$(basename "$file" .json)
              gh issue create \
                --title "Calendrier : $slug publié chez ESPN ($after matchs)" \
                --body "Le relevé de nuit vient de trouver les premiers matchs de \`$slug\` chez ESPN ($after matchs). Le fichier \`$file\` est commité par la même exécution et le site se met à jour au prochain déploiement."
            fi
          done

      - name: Un commit par fichier modifié
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed=$(git status --porcelain -- src/data/calendrier | awk '{ print $2 }')
          if [ -z "$changed" ]; then
            echo "Calendrier inchangé."
            exit 0
          fi
          for file in $changed; do
            git add -- "$file"
            git commit -m "chore(calendrier): met à jour $(basename "$file" .json)" -- "$file"
          done
          git push
